<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE GUILD | Member Perks & Privileges Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #06080d;
      --bg-card: rgba(16, 22, 34, 0.88);
      --gold: #c9a449;
      --gold-light: #e6c875;
      --gold-border: rgba(201, 164, 73, 0.35);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-primary); color: var(--text-main); font-family: 'Inter', sans-serif; line-height: 1.6; }
    h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    .navbar { position: sticky; top: 0; z-index: 100; background: rgba(6, 8, 13, 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-subtle); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 76px; }
    .brand { text-decoration: none; color: var(--text-main); font-family: 'Playfair Display', serif; font-weight: 700; letter-spacing: 0.14em; font-size: 1.4rem; }
    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.88rem; font-weight: 500; }
    .nav-links a:hover, .nav-links a.active { color: var(--gold-light); }
    .btn-gold { background: linear-gradient(135deg, var(--gold-light), var(--gold)); color: #06080d; font-weight: 700; padding: 11px 22px; border-radius: 99px; text-decoration: none; font-size: 0.85rem; }

    .page-hero { padding: 72px 0 54px; text-align: center; border-bottom: 1px solid var(--border-subtle); }
    .eyebrow { color: var(--gold); font-size: 0.74rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; display: block; margin-bottom: 12px; }
    .page-hero h1 { font-size: clamp(2.1rem, 4vw, 3.2rem); margin-bottom: 14px; }
    .page-hero p { color: var(--text-muted); max-width: 720px; margin: 0 auto; }

    .section { padding: 72px 0; border-bottom: 1px solid var(--border-subtle); }
    .active-hotel-box {
      background: linear-gradient(145deg, rgba(20, 29, 47, 0.96), rgba(10, 14, 22, 0.98));
      border: 2px solid var(--gold); border-radius: 18px; padding: 40px;
    }
    .badge-live { display: inline-block; background: rgba(16, 185, 129, 0.16); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); font-size: 0.72rem; font-weight: 700; padding: 5px 14px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 16px; }
    .hotel-tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 28px; }
    .tier-card { background: rgba(6, 8, 13, 0.8); border: 1px solid var(--gold-border); border-radius: 12px; padding: 24px; }
    .tier-card h4 { font-size: 1.15rem; color: var(--gold-light); margin-bottom: 8px; }
    .tier-card p { font-size: 0.88rem; color: var(--text-muted); }

    /* Blurred Sample Perks Grid */
    .perks-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 40px; }
    .perk-sample-card {
      position: relative; background: var(--bg-card); border: 1px solid var(--border-subtle);
      border-radius: 14px; padding: 28px; min-height: 230px; overflow: hidden;
    }
    .perk-blurred-inner {
      filter: blur(6px); opacity: 0.32; user-select: none; pointer-events: none;
    }
    .perk-tag { font-size: 1.15rem; font-weight: 800; color: var(--gold-light); margin-bottom: 8px; letter-spacing: 0.08em; }
